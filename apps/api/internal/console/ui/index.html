<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freedom Exchange · Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#ffffff;--sidebar:#f9f9f8;--panel:#ffffff;--hair:#ebebec;--hair-2:#dedee0;--hover:#fafafa;
  --ink:#1c1c1e;--ink-2:#6b6f76;--ink-3:#9a9ea5;--accent:#2f5bea;--accent-soft:#e8effc;--selected:#eef2fd;
  --btn:#1a1a1c;--btn-ink:#ffffff;
  --c-green-bg:#e6f5ec;--c-green:#0d6b3f;--c-blue-bg:#e8effc;--c-blue:#2857c4;--c-orange-bg:#fdefdc;--c-orange:#9a5b12;
  --c-red-bg:#fde9e9;--c-red:#b42318;--c-purple-bg:#efe9fc;--c-purple:#6b3fc4;--c-gray-bg:#f0f0f1;--c-gray:#4b4f55;
  --c-yellow-bg:#fbf4d7;--c-yellow:#8a6b0a;
  --shadow:0 8px 32px rgba(20,20,24,.10),0 0 0 1px var(--hair-2);
  --r-ctl:6px;--r-panel:8px;--r-dlg:10px;--t:150ms;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0f0f10;--sidebar:#151516;--panel:#1a1a1b;--hair:#29292b;--hair-2:#333336;--hover:#161617;
  --ink:#ececec;--ink-2:#a0a3a8;--ink-3:#6c6f75;--accent:#6d8cf5;--accent-soft:#1c2540;--selected:#1a2138;
  --btn:#ececec;--btn-ink:#111113;
  --c-green-bg:#12301f;--c-green:#7ed6a5;--c-blue-bg:#182543;--c-blue:#92b0ff;--c-orange-bg:#3a2a12;--c-orange:#f0b76a;
  --c-red-bg:#3d1a1a;--c-red:#f39a94;--c-purple-bg:#2a1f45;--c-purple:#c3a8ff;--c-gray-bg:#2a2a2c;--c-gray:#c4c6ca;
  --c-yellow-bg:#352e12;--c-yellow:#e6c65a;
  --shadow:0 8px 32px rgba(0,0,0,.55),0 0 0 1px var(--hair-2);
}}
:root[data-theme="dark"]{
  --ground:#0f0f10;--sidebar:#151516;--panel:#1a1a1b;--hair:#29292b;--hair-2:#333336;--hover:#161617;
  --ink:#ececec;--ink-2:#a0a3a8;--ink-3:#6c6f75;--accent:#6d8cf5;--accent-soft:#1c2540;--selected:#1a2138;
  --btn:#ececec;--btn-ink:#111113;
  --c-green-bg:#12301f;--c-green:#7ed6a5;--c-blue-bg:#182543;--c-blue:#92b0ff;--c-orange-bg:#3a2a12;--c-orange:#f0b76a;
  --c-red-bg:#3d1a1a;--c-red:#f39a94;--c-purple-bg:#2a1f45;--c-purple:#c3a8ff;--c-gray-bg:#2a2a2c;--c-gray:#c4c6ca;
  --c-yellow-bg:#352e12;--c-yellow:#e6c65a;
  --shadow:0 8px 32px rgba(0,0,0,.55),0 0 0 1px var(--hair-2);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono,.num{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.num,.tnum{font-variant-numeric:tabular-nums}
.r{text-align:right}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:500}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px}h3{font-size:14px}
[hidden]{display:none!important}
kbd{font:inherit;font-size:11px;color:var(--ink-3);border:1px solid var(--hair-2);border-radius:4px;padding:0 4px;line-height:16px}

/* ---------- sign-in ---------- */
#signin{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--sidebar)}
.card{width:360px;background:var(--panel);border:1px solid var(--hair-2);border-radius:var(--r-dlg);padding:24px}
.card .tile{margin-bottom:14px}
.card p{margin:4px 0 18px;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--ink-2)}
.in{height:32px;padding:0 10px;border:1px solid var(--hair-2);border-radius:var(--r-ctl);background:var(--ground);outline:none;transition:border-color var(--t),box-shadow var(--t)}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 10px) 13px;background-size:4px 4px;background-repeat:no-repeat;padding-right:26px}
.btn{height:30px;padding:0 12px;border:1px solid var(--hair-2);border-radius:var(--r-ctl);background:var(--panel);display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background var(--t),border-color var(--t)}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{opacity:.92}
.btn.danger{color:var(--c-red);border-color:var(--hair-2)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn:focus-visible,.in:focus-visible,.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--c-red);font-size:12px;min-height:16px;margin-top:6px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:240px 1fr;height:100vh}
.sb{background:var(--sidebar);border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.ws{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.tile{width:28px;height:28px;border-radius:6px;background:var(--btn);color:var(--btn-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.tile.lg{width:40px;height:40px;font-size:17px;border-radius:8px}
.ws-name{font-weight:600;font-size:13px;line-height:16px}
.ws-date{font-size:12px;color:var(--ink-2);line-height:16px}
.search{margin:2px 10px 8px;height:30px;display:flex;align-items:center;gap:8px;padding:0 8px 0 9px;border:1px solid var(--hair-2);border-radius:var(--r-ctl);background:var(--panel);color:var(--ink-3)}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.nav{flex:1;overflow:auto;padding:2px 10px 10px}
.nav .grp{margin-top:12px}
.nav .grp .eyebrow{padding:0 8px 4px}
.nav a{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:var(--r-ctl);color:var(--ink-2);transition:background var(--t),color var(--t)}
.nav a:hover{background:rgba(0,0,0,.035);text-decoration:none;color:var(--ink)}
:root[data-theme="dark"] .nav a:hover{background:rgba(255,255,255,.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav a:hover{background:rgba(255,255,255,.05)}}
.nav a.on{color:var(--accent);font-weight:500;background:rgba(0,0,0,.045)}
:root[data-theme="dark"] .nav a.on{background:rgba(255,255,255,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav a.on{background:rgba(255,255,255,.06)}}
.nav a .cnt{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav a.on .cnt{color:var(--accent)}
.sb-foot{border-top:1px solid var(--hair);padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.sb-foot .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-foot .who b{color:var(--ink);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--hair-2);border-radius:var(--r-ctl);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;width:26px;height:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);cursor:pointer}
.seg button.on{background:var(--hover);color:var(--ink)}
.seg button svg.i{width:14px;height:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-3);cursor:pointer}
.linkbtn:hover{color:var(--ink)}

main{display:flex;flex-direction:column;min-width:0;min-height:0}
.hd{height:44px;border-bottom:1px solid var(--hair);display:flex;align-items:center;padding:0 20px;gap:12px;flex:none}
.crumb{display:flex;align-items:center;gap:6px;font-weight:500;min-width:0}
.crumb .sep{color:var(--ink-3)}
.crumb .obj{color:var(--ink-2)}
.hd-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.toolbar{height:40px;border-bottom:1px solid var(--hair);display:flex;align-items:center;padding:0 20px;gap:8px;flex:none;position:relative}
.toolbar .count{margin-left:auto;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.chipbtn{height:26px;padding:0 9px;border:1px dashed var(--hair-2);border-radius:var(--r-ctl);background:transparent;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);cursor:pointer;font-size:12px}
.chipbtn:hover{background:var(--hover);color:var(--ink)}
.chipbtn.set{border-style:solid;color:var(--ink);background:var(--panel)}
.chipbtn .x{color:var(--ink-3);margin-left:2px}
.chipbtn .x:hover{color:var(--ink)}
.pop{position:absolute;top:36px;left:20px;z-index:20;background:var(--panel);border:1px solid var(--hair-2);border-radius:var(--r-panel);box-shadow:var(--shadow);min-width:200px;padding:4px}
.pop .it{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:var(--r-ctl);cursor:pointer;font-size:12.5px}
.pop .it:hover{background:var(--hover)}
.pop .it .k{margin-left:auto;color:var(--ink-3);font-size:11px}
.pop .hdr{padding:6px 8px 2px;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.content{flex:1;overflow:auto;min-height:0}
.pad{padding:20px}
.empty{padding:28px 20px;color:var(--ink-2)}
.note{padding:9px 20px;border-bottom:1px solid var(--hair);color:var(--ink-2);font-size:12.5px;background:var(--sidebar)}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{position:sticky;top:0;z-index:2;background:var(--ground);height:32px;font-size:12px;font-weight:500;color:var(--ink-2);text-align:left;padding:0 12px;border-bottom:1px solid var(--hair);white-space:nowrap;user-select:none;cursor:pointer}
.tbl th .h{display:inline-flex;align-items:center;gap:6px}
.tbl th svg.i{width:13px;height:13px;color:var(--ink-3)}
.tbl th.r .h{flex-direction:row-reverse}
.tbl th .dir{color:var(--accent);font-size:10px}
.tbl td{height:36px;padding:0 12px;border-bottom:1px solid var(--hair);white-space:nowrap;vertical-align:middle;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.tbl td.first{font-weight:500;position:sticky;left:0;background:var(--ground);z-index:1}
.tbl th.first{left:0;z-index:3}
.tbl .ck{width:36px;padding:0 0 0 20px}
.tbl .ck input{width:14px;height:14px;margin:0;vertical-align:middle;accent-color:var(--accent)}
.tbl tbody tr{cursor:pointer;transition:background var(--t)}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl tbody tr.sel td{background:var(--selected)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px}
.tbl.compact td{height:32px}
.tbl.compact th{height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px 0 7px;border-radius:5px;font-size:12px;font-weight:500;line-height:20px;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.green{background:var(--c-green-bg);color:var(--c-green)}
.chip.blue{background:var(--c-blue-bg);color:var(--c-blue)}
.chip.orange{background:var(--c-orange-bg);color:var(--c-orange)}
.chip.red{background:var(--c-red-bg);color:var(--c-red)}
.chip.purple{background:var(--c-purple-bg);color:var(--c-purple)}
.chip.gray{background:var(--c-gray-bg);color:var(--c-gray)}
.chip.yellow{background:var(--c-yellow-bg);color:var(--c-yellow)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor}
.more{display:flex;justify-content:center;padding:12px}

/* ---------- peek ---------- */
.peek{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100vw;background:var(--panel);border-left:1px solid var(--hair-2);box-shadow:var(--shadow);transform:translateX(100%);transition:transform var(--t) ease;z-index:30;display:flex;flex-direction:column}
.peek.on{transform:none}
.peek .ph{padding:16px 20px 12px;border-bottom:1px solid var(--hair);display:flex;align-items:flex-start;gap:12px}
.peek .ph h2{font-size:15px}
.peek .ph .sub{color:var(--ink-2);font-size:12px;margin-top:2px}
.peek .ph .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.peek .close{margin-left:auto}
.peek .pb{flex:1;overflow:auto;padding:8px 20px 24px}
.peek .sec{margin-top:18px}
.peek .sec h3{font-size:12px;color:var(--ink-3);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.attrs{display:grid;grid-template-columns:150px 1fr;row-gap:0}
.attrs>div{min-height:30px;display:flex;align-items:center;border-bottom:1px solid var(--hair);padding:5px 0;min-width:0}
.attrs .k{color:var(--ink-2);gap:7px;font-size:12.5px}
.attrs .k svg.i{width:14px;height:14px;color:var(--ink-3)}
.attrs .v{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:20px;padding:5px 0}
.attrs .v.wrap{white-space:normal;line-height:1.4}
.peek .acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px;margin-top:6px}
.confirm{border:1px solid var(--hair-2);border-radius:var(--r-panel);padding:12px;margin-top:10px;background:var(--ground)}
.confirm p{margin:0 0 10px}
.confirm .row{display:flex;gap:8px;margin-top:10px}
pre.json{margin:0;padding:10px 12px;border:1px solid var(--hair);border-radius:var(--r-ctl);background:var(--ground);font:12px/1.5 "JetBrains Mono",monospace;white-space:pre-wrap;word-break:break-all;color:var(--ink-2)}
.body{white-space:pre-wrap;line-height:1.5;color:var(--ink)}

/* ---------- overview ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.tl{border:1px solid var(--hair-2);border-radius:var(--r-panel);padding:12px 14px;background:var(--panel);min-height:82px;cursor:pointer;transition:border-color var(--t)}
.tl:hover{border-color:var(--ink-3)}
.tl .n{font-size:20px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:26px}
.tl .l{font-size:12.5px;color:var(--ink);margin-top:2px}
.tl .s{font-size:12px;color:var(--ink-2);margin-top:1px;line-height:1.35}
.tl.warn .n{color:var(--c-red)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.sec-h h2{font-size:14px}
.sec-h .muted{font-size:12px}
.sec-h a{margin-left:auto;font-size:12px}
.timeline{border:1px solid var(--hair-2);border-radius:var(--r-panel);padding:16px 18px 14px;background:var(--panel)}
.tl-track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tl-step{position:relative;padding-top:12px}
.tl-step .bar{height:3px;border-radius:2px;background:var(--hair-2)}
.tl-step.done .bar{background:var(--ink-3)}
.tl-step.now .bar{background:var(--accent)}
.tl-step .t{margin-top:8px;font-size:12px;font-weight:500}
.tl-step .d{font-size:11.5px;color:var(--ink-2)}
.tl-step.now .t{color:var(--accent)}
.tl-step .pin{position:absolute;top:0;left:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600}
.panel{border:1px solid var(--hair-2);border-radius:var(--r-panel);background:var(--panel);overflow:auto}
.panel .tbl th{background:var(--panel)}
.panel .tbl td.first{background:var(--panel)}
.panel .tbl tr:last-child td{border-bottom:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>div{min-width:0}
@media (max-width:1100px){.two{grid-template-columns:1fr}}

/* ---------- record ---------- */
.rec-h{padding:18px 20px 0;display:flex;align-items:center;gap:14px}
.rec-h .name{min-width:0}
.rec-h .name h1{font-size:18px;display:flex;align-items:center;gap:10px}
.rec-h .name .sub{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.rec-h .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.record{display:flex;flex-direction:column;height:100%}
.rec{display:grid;grid-template-columns:320px 1fr;min-height:0;flex:1}
.rec-attrs{border-right:1px solid var(--hair);padding:12px 20px 24px;overflow:auto}
.rec-attrs .sec{margin-top:16px}
.rec-attrs .sec h3{font-size:11px;color:var(--ink-3);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.rec-attrs .attrs{grid-template-columns:132px 1fr}
.rec-main{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:2px;padding:8px 20px 0;border-bottom:1px solid var(--hair);flex:none;overflow-x:auto}
.tabs button{border:0;background:none;height:32px;padding:0 10px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button .cnt{color:var(--ink-3);font-size:11px;margin-left:5px}
.tab-body{flex:1;overflow:auto;min-height:0}
.check{display:grid;grid-template-columns:20px 1fr 150px 210px;gap:0 12px;align-items:center}
.check>div{border-bottom:1px solid var(--hair);min-height:36px;display:flex;align-items:center}
.check .hd-row{font-size:12px;color:var(--ink-2);min-height:30px}
.check .ok{color:var(--c-green)}.check .no{color:var(--c-red)}
.chart{position:relative}
.chart svg{display:block;max-width:100%;height:280px}
.chart .tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--hair-2);border-radius:var(--r-ctl);padding:6px 8px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;transform:translate(-50%,-110%)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:2px;background:var(--accent);vertical-align:middle;margin-right:6px}
.legend i.ex{width:2px;height:10px;background:var(--ink-3)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);background:var(--btn);color:var(--btn-ink);padding:8px 14px;border-radius:var(--r-ctl);font-size:12.5px;opacity:0;pointer-events:none;transition:opacity var(--t),transform var(--t);z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;width:12px;height:12px;border:1.5px solid var(--hair-2);border-top-color:var(--ink-2);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:20px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<div id="signin">
  <form class="card" id="signin-form" autocomplete="off">
    <div class="tile lg">F</div>
    <h2>Freedom Exchange</h2>
    <p>Operations console. Actions are recorded against your name.</p>
    <div class="field"><label for="si-name">Your name</label><input class="in" id="si-name" placeholder="e.g. Ngozi A." required></div>
    <div class="field"><label for="si-token">Console token</label><input class="in" id="si-token" type="password" placeholder="CONSOLE_TOKEN" required></div>
    <button class="btn primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
    <div class="err" id="si-err"></div>
  </form>
</div>

<div id="app" hidden>
  <aside class="sb">
    <div class="ws"><div class="tile">F</div><div><div class="ws-name">Freedom Exchange</div><div class="ws-date" id="sb-date">—</div></div></div>
    <label class="search"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="q" placeholder="Search" spellcheck="false"><kbd>⌘K</kbd></label>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">
      <span class="who" id="who"></span>
      <span class="seg" id="theme"></span>
      <button class="linkbtn" id="signout" title="Sign out"><svg class="i" viewBox="0 0 16 16"><path d="M6 2H3.5A1.5 1.5 0 0 0 2 3.5v9A1.5 1.5 0 0 0 3.5 14H6M10 11l3-3-3-3M13 8H6"/></svg></button>
    </div>
  </aside>
  <main>
    <header class="hd"><div class="crumb" id="crumb"></div><div class="hd-actions" id="hd-actions"></div></header>
    <div class="toolbar" id="toolbar"></div>
    <div class="content" id="content"></div>

  <aside class="peek" id="peek" aria-hidden="true"></aside>
</div>
<div id="toast"></div>

<script>
// ---------- helpers ----------
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NG = new Intl.NumberFormat('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const N0 = new Intl.NumberFormat('en-NG');
const naira = k => k==null ? '—' : (k<0?'−':'') + '₦' + NG.format(Math.abs(Number(k))/100);
const nairaC = k => { if(k==null) return '—'; const v=Number(k)/100, a=Math.abs(v); const s=a>=1e9?(a/1e9).toFixed(2)+'bn':a>=1e6?(a/1e6).toFixed(2)+'m':a>=1e4?(a/1e3).toFixed(1)+'k':NG.format(a); return (v<0?'−':'')+'₦'+s; };
const shares = u => { if(u==null) return '—'; const v=Number(u)/1e8; return v.toLocaleString('en-NG',{maximumFractionDigits:8}); };
const sharesC = u => { if(u==null) return '—'; const v=Number(u)/1e8, a=Math.abs(v); const s=a>=1e6?(a/1e6).toFixed(2)+'m':a>=1e4?(a/1e3).toFixed(1)+'k':a>=1?a.toLocaleString('en-NG',{maximumFractionDigits:2}):a.toLocaleString('en-NG',{maximumFractionDigits:8}); return (v<0?'−':'')+s; };
const bps = v => v==null ? '—' : (Number(v)/100).toFixed(2)+'%';
const int = v => v==null ? '—' : N0.format(Number(v));
const fmtDate = s => s ? String(s).slice(0,10) : '—';
const fmtTime = iso => iso ? new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'}) : '—';
const fmtClock = iso => iso ? new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Africa/Lagos'}) : '—';
const short = s => s ? String(s).slice(0,8) : '—';
const title = s => String(s||'').replace(/_/g,' ');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2800); }

// ---------- icons (16px, 1.5 stroke) ----------
const I = {
  overview:'<path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h3A1.5 1.5 0 0 1 8 3.5v3A1.5 1.5 0 0 1 6.5 8h-3A1.5 1.5 0 0 1 2 6.5zM10 3.5A1.5 1.5 0 0 1 11.5 2h1A1.5 1.5 0 0 1 14 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-1a1.5 1.5 0 0 1-1.5-1.5zM2 11.5A1.5 1.5 0 0 1 3.5 10h3A1.5 1.5 0 0 1 8 11.5v1A1.5 1.5 0 0 1 6.5 14h-3A1.5 1.5 0 0 1 2 12.5z"/>',
  sessions:'<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/>',

  listings:'<path d="M3 13.5V4a1.5 1.5 0 0 1 1.5-1.5h7A1.5 1.5 0 0 1 13 4v9.5"/><path d="M2 13.5h12M6 5.5h1M9 5.5h1M6 8h1M9 8h1M7 13.5v-3h2v3"/>',
  members:'<circle cx="6" cy="5.5" r="2.5"/><path d="M2 13.5c0-2.5 1.8-4 4-4s4 1.5 4 4"/><circle cx="11.5" cy="6" r="2"/><path d="M11 9.5c1.8 0 3 1.4 3 3.5"/>',
  mm:'<path d="M2 8h2l2-4 3 8 2-5 1.5 1H14"/>',
  surveillance:'<path d="M8 2.5 13 4.5v4c0 3-2.2 4.8-5 5.5-2.8-.7-5-2.5-5-5.5v-4z"/><path d="M6 8l1.5 1.5L10.5 6.5"/>',
  halts:'<circle cx="8" cy="8" r="5.5"/><path d="M6 6v4M10 6v4"/>',
  closed:'<rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>',
  buyback:'<path d="M3 5.5A5.5 5.5 0 0 1 12.5 4L14 5.5M13 10.5A5.5 5.5 0 0 1 3.5 12L2 10.5"/><path d="M14 2v3.5h-3.5M2 14v-3.5h3.5"/>',
  settlement:'<path d="M2 5.5h12M2 5.5v6A1.5 1.5 0 0 0 3.5 13h9a1.5 1.5 0 0 0 1.5-1.5v-6M4 3h8"/><path d="M5 9.5h3"/>',
  recon:'<path d="M2.5 6.5 5 4l2.5 2.5M5 4v8M13.5 9.5 11 12l-2.5-2.5M11 12V4"/>',
  corp:'<path d="M8 2.5v11M4.5 5.5l3.5-3 3.5 3M4.5 10.5l3.5 3 3.5-3"/>',
  disclosures:'<path d="M3 3.5h10v7H6.5L3 13z"/><path d="M5.5 6.5h5M5.5 8.5h3"/>',
  calendar:'<rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5 2v2M11 2v2"/>',
  index:'<path d="M2 12.5 6 7l3 3 5-6.5"/>',
  complaints:'<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.5M8 10.8v.2"/>',
  clock:'<circle cx="8" cy="8" r="5.5"/><path d="M8 4.5V8l2.5 1.5"/>',
  text:'<path d="M3 4h10M3 8h10M3 12h6"/>',

  number:'<path d="M2.5 5h11M2.5 11h11M6.5 2.5 5 13.5M11 2.5 9.5 13.5"/>',
  chip:'<circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="1.5"/>',
  date:'<rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5 2v2M11 2v2"/>',
  time:'<circle cx="8" cy="8" r="5.5"/><path d="M8 4.5V8l2.5 1.5"/>',
  money:'<circle cx="8" cy="8" r="5.5"/><path d="M8 4.5v7M6 6.5h3a1.25 1.25 0 0 1 0 2.5H7a1.25 1.25 0 0 0 0 2.5h3"/>',
  units:'<path d="M8 2 13.5 5v6L8 14 2.5 11V5z"/><path d="M8 8v6M2.5 5 8 8l5.5-3"/>',
  bool:'<rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><path d="m5.5 8 2 2 3-4"/>',
  link:'<path d="M6.5 9.5 9.5 6.5M7 4.5l1-1a2.5 2.5 0 0 1 3.5 3.5l-1 1M9 11.5l-1 1a2.5 2.5 0 0 1-3.5-3.5l1-1"/>',
  sun:'<circle cx="8" cy="8" r="2.75"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/>',
  moon:'<path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/>',
  auto:'<rect x="2" y="3" width="12" height="9" rx="1.5"/><path d="M6 14h4"/>',
  x:'<path d="m4 4 8 8M12 4l-8 8"/>',
  filter:'<path d="M2.5 3.5h11L9.5 8.5v4l-3 1v-5z"/>',
  sort:'<path d="M4.5 3v10M4.5 13l-2-2M4.5 13l2-2M11.5 13V3M11.5 3l-2 2M11.5 3l2 2"/>',
  check:'<path d="m3.5 8.5 3 3 6-7"/>',
  arrow:'<path d="M3 8h10M9 4l4 4-4 4"/>',
  play:'<path d="M5 3.5v9l7-4.5z"/>',
};
const ic = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 16 16" aria-hidden="true">${I[n]||I.text}</svg>`;

// ---------- session (token + operator, in localStorage) ----------
const SS = { get(){ try{ return JSON.parse(localStorage.getItem('freedom.console.session')||'null') }catch(e){ return null } },
  set(v){ try{ localStorage.setItem('freedom.console.session', JSON.stringify(v)) }catch(e){} },
  clear(){ try{ localStorage.removeItem('freedom.console.session') }catch(e){} } };
class ApiError extends Error { constructor(status, code, message){ super(message); this.status=status; this.code=code; } }
async function api(path, opts={}){
  const s = SS.get(); if(!s) throw new ApiError(401,'unauthenticated','Not signed in');
  const headers = Object.assign({'Authorization':'Bearer '+s.token, 'X-Operator': s.name}, opts.body?{'Content-Type':'application/json'}:{}, opts.headers||{});
  const r = await fetch('/console/api/'+path, Object.assign({}, opts, {headers, body: opts.body?JSON.stringify(opts.body):undefined}));
  let j = null; try{ j = await r.json() }catch(e){}
  if(r.status===401){ signOut(); throw new ApiError(401, 'unauthenticated', 'Session expired; sign in again'); }
  if(!r.ok) throw new ApiError(r.status, j?.code||'error', j?.message||r.statusText);
  return j;
}
async function signIn(e){
  e.preventDefault();
  const name=$('#si-name').value.trim(), token=$('#si-token').value;
  const err=$('#si-err'); err.textContent='';
  if(!name){ err.textContent='Enter your name.'; return; }
  const r = await fetch('/console/api/overview',{headers:{'Authorization':'Bearer '+token}});
  if(r.status===401){ err.textContent='That token was not accepted.'; return; }
  if(!r.ok){ err.textContent='The console could not be reached ('+r.status+').'; return; }
  SS.set({name, token}); $('#si-token').value='';
  boot();
}
function signOut(){ SS.clear(); $('#app').hidden=true; $('#signin').hidden=false; $('#si-name').focus(); }
$('#signin-form').onsubmit = signIn;
$('#signout').onclick = signOut;

// ---------- theme ----------
const THEMES=[['system','auto','System'],['light','sun','Light'],['dark','moon','Dark']];
function applyTheme(t){ if(t==='system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t; try{localStorage.setItem('freedom.console.theme',t)}catch(e){}
  $('#theme').innerHTML=THEMES.map(([k,i,l])=>`<button class="${k===t?'on':''}" data-theme="${k}" title="${l}" aria-label="${l}">${ic(i)}</button>`).join('');
  $$('#theme button').forEach(b=>b.onclick=()=>applyTheme(b.dataset.theme)); }
applyTheme((()=>{try{return localStorage.getItem('freedom.console.theme')||'system'}catch(e){return 'system'}})());

// ---------- nav ----------
const NAV = [
  ['Market', [['overview','Overview','overview'],['sessions','Sessions','sessions','sessions_today'],['orders','Orders','orders'],['fills','Fills','fills','trades_today']]],
  ['Records', [['instruments','Instruments','instruments','listed'],['listings','Companies & listings','listings','pending_applications'],['members','Members','members','active_members'],['market-makers','Market makers','mm','mm_not_met_today']]],
  ['Integrity', [['surveillance','Surveillance','surveillance','open_alerts'],['halts','Halts & incidents','halts','open_halts_incidents'],['closed-periods','Closed periods','closed']]],
  ['Post-trade', [['buyback','Buyback','buyback','buyback_pending_intents'],['settlement','Settlement','settlement'],['reconciliation','Reconciliation','recon','open_breaks']]],
  ['Institution', [['corporate-actions','Corporate actions','corp'],['disclosures','Disclosures','disclosures','unpublished_disclosures'],['calendar','Calendar','calendar'],['index','Index','index'],['complaints','Complaints & protection','complaints','open_complaints'],['clock','Clock','clock','clock_out_of_bounds_24h']]],
];
function renderNav(){
  const c = state.overview?.counts||{}; const sess=(state.overview?.sessions_by_state||[]).reduce((a,r)=>a+r.n,0);
  const cnt = k => k==='sessions_today' ? sess : k==='open_halts_incidents' ? (c.open_halts||0)+(c.open_incidents||0) : (c[k]??'');
  $('#nav').innerHTML = NAV.map(([g,items])=>`<div class="grp"><div class="eyebrow">${g}</div>${items.map(([v,l,i,k])=>`<a href="#/${v}" data-view="${v}" class="${state.view===v?'on':''}">${ic(i)}<span>${l}</span><span class="cnt">${k?(cnt(k)||''):''}</span></a>`).join('')}</div>`).join('');
}

// ---------- state / routing ----------
const state = { view:'overview', id:null, overview:null, data:null, rows:[], filters:[], sort:null, q:'', tab:null, sel:null, params:{} };
function route(){
  const h=location.hash.replace(/^#\/?/,''); const [view, ...rest]=h.split('/'); const id = rest.length?decodeURIComponent(rest.join('/')):null;
  const changed = view!==state.view || id!==state.id;
  state.view = view||'overview'; state.id=id;
  if(changed){ state.filters=[]; state.sort=null; state.q=''; $('#q').value=''; state.sel=null; closePeek(); }
  load();
}
window.addEventListener('hashchange', route);
async function boot(){
  const s=SS.get(); if(!s){ signOut(); return; }
  $('#signin').hidden=true; $('#app').hidden=false; $('#who').innerHTML='<b>'+esc(s.name)+'</b>'; $('#who').title='Signed in as '+s.name;
  await refreshOverview(); route();
}
async function refreshOverview(){ try{ state.overview = await api('overview'); $('#sb-date').textContent = state.overview.business_date + ' · ' + title(state.overview.phase); renderNav(); }catch(e){ if(e.status!==401) toast(e.message); } }
setInterval(refreshOverview, 60000);

// ---------- loading a view ----------
let loadSeq=0;
async function load(){
  const spec = VIEWS[state.view] || VIEWS.overview;
  const seq=++loadSeq;
  renderNav(); setCrumb(spec); $('#hd-actions').innerHTML=''; $('#toolbar').innerHTML='';
  $('#content').innerHTML='<div class="loading"><span class="spin"></span>Loading</div>';
  try{
    if(state.view==='instruments' && state.id){ state.data = await api('instruments/'+encodeURIComponent(state.id)); if(seq!==loadSeq) return; renderRecord(); return; }
    state.data = await spec.load(state.params);
    if(seq!==loadSeq) return;
    state.rows = spec.rows ? (spec.rows(state.data)||[]) : [];
    render();
    if(state.id && spec.open) spec.open(state.id);
  }catch(e){ if(seq!==loadSeq) return; $('#content').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}
function setCrumb(spec){ $('#crumb').innerHTML=`<span class="obj">${esc(spec.object)}</span><span class="sep">›</span><span>${esc(spec.title)}</span>`; }
function render(){
  const spec = VIEWS[state.view] || VIEWS.overview;
  setCrumb(spec);
  $('#hd-actions').innerHTML = (spec.actions||[]).map((a,i)=>`<button class="btn ${a.kind||''}" data-act="${i}">${a.icon?ic(a.icon):''}${esc(a.label)}</button>`).join('');
  $$('#hd-actions [data-act]').forEach(b=>b.onclick=()=>spec.actions[b.dataset.act].run());
  if(spec.render){ $('#toolbar').innerHTML = spec.toolbar ? spec.toolbar() : ''; spec.render($('#content')); return; }
  renderToolbar(spec); renderTable(spec);
  const n = spec.toolbarNote && spec.toolbarNote(state.data); if(n) $('#content').insertAdjacentHTML('afterbegin', `<div class="note">${esc(n)}</div>`);
}

// ---------- list views: filter / sort / table ----------
function visibleRows(spec){
  let rows = state.rows.slice();
  for(const f of state.filters) rows = rows.filter(r => String(r[f.k]??'') === f.v);
  if(state.q){ const q=state.q.toLowerCase(); rows = rows.filter(r => spec.columns.some(c => String(cellText(c, r)).toLowerCase().includes(q))); }
  const s = state.sort || spec.defaultSort;
  if(s){ const c = spec.columns.find(x=>x.k===s.k); rows.sort((a,b)=>{ const va=a[s.k], vb=b[s.k]; if(va==null&&vb==null) return 0; if(va==null) return 1; if(vb==null) return -1; const n = (typeof va==='number'&&typeof vb==='number') ? va-vb : String(va).localeCompare(String(vb)); return s.dir*n; }); }
  return rows;
}
function renderToolbar(spec){
  const tb=$('#toolbar'); const rows = visibleRows(spec);
  const chipCols = spec.columns.filter(c=>c.t==='chip'||c.t==='bool');
  const sortCols = spec.columns.filter(c=>!c.nosort);
  const s = state.sort;
  tb.innerHTML = (spec.dateParam ? `<label class="chipbtn set" style="border-style:solid">${ic('date')}<input type="date" id="tb-date" class="tnum" style="border:0;background:transparent;color:inherit;font:inherit;outline:none" value="${esc(state.params.date||state.overview?.business_date||'')}"></label>` : '')
    + state.filters.map((f,i)=>`<button class="chipbtn set" data-rm="${i}">${ic('filter')}${esc(colLabel(spec,f.k))} is <b>${esc(title(f.v))}</b><span class="x">${ic('x')}</span></button>`).join('')
    + (chipCols.length?`<button class="chipbtn" id="tb-filter">${ic('filter')}Filter</button>`:'')
    + `<button class="chipbtn ${s?'set':''}" id="tb-sort">${ic('sort')}${s?esc(colLabel(spec,s.k))+' '+(s.dir>0?'↑':'↓'):'Sort'}</button>`
    + `<span class="count">${rows.length} ${rows.length===1?'record':'records'}${state.data?.next_cursor?' · more available':''}</span>`;
  $$('#toolbar [data-rm]').forEach(b=>b.onclick=()=>{ state.filters.splice(+b.dataset.rm,1); render(); });
  const fd=$('#tb-date'); if(fd) fd.onchange=()=>{ state.params.date=fd.value; load(); };
  const fb=$('#tb-filter'); if(fb) fb.onclick=()=>popover(fb, chipCols.flatMap(c=>{ const vals=[...new Set(state.rows.map(r=>String(r[c.k]??'')))].filter(v=>v!=='').sort(); return [{hdr:c.l}, ...vals.map(v=>({label:title(v), k:String(state.rows.filter(r=>String(r[c.k]??'')===v).length), run:()=>{ state.filters=state.filters.filter(f=>f.k!==c.k); state.filters.push({k:c.k,v}); render(); }}))]; }));
  const sb=$('#tb-sort'); sb.onclick=()=>popover(sb, [...sortCols.map(c=>({label:c.l, k: s&&s.k===c.k?(s.dir>0?'asc':'desc'):'', run:()=>{ state.sort = s&&s.k===c.k ? {k:c.k, dir:-s.dir} : {k:c.k, dir: c.t==='chip'||c.t==='text'||c.t==='sym'?1:-1}; render(); }})), ...(s?[{hdr:''},{label:'Clear sort', run:()=>{ state.sort=null; render(); }}]:[])]);
}
function colLabel(spec,k){ return (spec.columns.find(c=>c.k===k)||{l:k}).l; }
function popover(anchor, items){
  closePop(); const p=document.createElement('div'); p.className='pop'; p.id='pop';
  const r=anchor.getBoundingClientRect(), tr=anchor.offsetParent.getBoundingClientRect(); p.style.left=(r.left-tr.left)+'px';
  p.innerHTML = items.map((it,i)=> it.hdr!==undefined ? `<div class="hdr">${esc(it.hdr)}</div>` : `<div class="it" data-i="${i}"><span>${esc(it.label)}</span><span class="k">${esc(it.k||'')}</span></div>`).join('');
  anchor.parentElement.appendChild(p);
  $$('.it',p).forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); items[+el.dataset.i].run(); closePop(); });
  setTimeout(()=>document.addEventListener('click', closePop, {once:true}),0);
}
function closePop(){ const p=$('#pop'); if(p) p.remove(); }
const TYPE_ICON = {sym:'instruments', text:'text', chip:'chip', kobo:'money', units:'units', num:'number', bps:'number', mono:'hash', date:'date', time:'time', bool:'bool', link:'link'};
function cellText(c, r){ const v=r[c.k]; if(c.f) return c.f(v, r); switch(c.t){ case 'kobo': return naira(v); case 'units': return shares(v); case 'bps': return bps(v); case 'num': return int(v); case 'date': return fmtDate(v); case 'time': return fmtTime(v); case 'bool': return v==null?'—':v?'yes':'no'; case 'mono': return v==null?'—':String(v); default: return v==null||v===''?'—':String(v); } }
function cellHtml(c, r){
  const v=r[c.k];
  if(c.h) return c.h(v, r);
  if(c.t==='chip') return chip(v, c.tone);
  if(c.t==='bool') return v==null?'<span class="faint">—</span>':chip(v?(c.yes||'yes'):(c.no||'no'), v?(c.yesTone||'green'):(c.noTone||'gray'));
  if(c.t==='mono') return v==null?'<span class="faint">—</span>':`<span class="mono" title="${esc(v)}">${esc(c.full?v:short(v))}</span>`;
  if(c.t==='link') return v?`<a href="${esc(v)}">${esc(c.text||'open')}</a>`:'';
  const t = cellText(c, r); return t==='—'?'<span class="faint">—</span>':esc(t);
}
const TONES = { listed:'green', active:'green', published:'green', allocated:'green', met:'green', settled:'green', resolved:'green', final:'green', executed:'green', approved:'green', upheld:'green', paid:'green', applied:'green', continuous:'green', filled:'green', delivered:'green',

// ---------- overview ----------
function tile(n, label, sub, href, warn){ return `<a class="tl ${warn?'warn':''}" href="${href}" style="display:block;color:inherit;text-decoration:none"><div class="n">${n}</div><div class="l">${esc(label)}</div><div class="s">${sub||''}</div></a>`; }
function renderOverview(el){
  const d = state.data; state.overview = d; const c = d.counts; renderNav(); $('#sb-date').textContent = d.business_date + ' · ' + title(d.phase);
  const sess = d.sessions_by_state||[]; const sessTotal = sess.reduce((a,r)=>a+r.n,0);
  const published = (sess.find(r=>r.state==='published')||{n:0}).n, accepting=(sess.find(r=>r.state==='accepting')||{n:0}).n;
  const tiles = [
    tile(int(c.listed), 'Listed instruments', c.live>c.listed?`${c.live-c.listed} suspended or halted`:'auction-only unless graduated', '#/instruments'),
    tile(int(sessTotal), 'Sessions today', sess.length?sess.map(r=>`${r.n} ${title(r.state)}`).join(' · '):'none opened yet', '#/sessions'),
    tile(nairaC(c.notional_today_kobo), 'Notional traded today', `${int(c.trades_today)} trades · ${sharesC(c.matched_today_units)} sh`, '#/fills'),
    tile(int(c.open_block_alerts), 'Open block alerts', `${int(c.open_alerts)} open or triaged in all`, '#/surveillance', c.open_block_alerts>0),
    tile(int(c.open_halts), 'Open halts', `${int(c.open_incidents)} unresolved incidents`, '#/halts', c.open_halts>0),
    tile(int(c.unpublished_disclosures), 'Unpublished disclosures', 'each one holds a market shut', '#/disclosures', c.unpublished_disclosures>0),
    tile(int(c.pending_applications), 'Applications pending', 'submitted or in review', '#/listings'),
    tile(int(c.mm_not_met_today), 'MM obligations missed', `${int(c.mm_active)} providers active today`, '#/market-makers', c.mm_not_met_today>0),
    tile(nairaC(c.buyback_pending_kobo), 'Buyback funding pending', `${int(c.buyback_pending_intents)} intents · ${nairaC(c.buyback_escrowed_kobo)} escrowed`, '#/buyback'),
    tile(nairaC(c.buyback_allocated_today_kobo), 'Bought back today', 'funding allocated at today\'s price', '#/buyback'),
    tile(int(c.open_breaks), 'Open recon breaks', `${int(c.stale_references)} stale references`, '#/reconciliation', c.open_breaks>0||c.stale_references>0),
    tile(int(c.open_complaints), 'Open complaints', `${int(c.overdue_complaints)} overdue`, '#/complaints', c.overdue_complaints>0),
  ].join('');

  // Session timeline. The day's shape is fixed by exchange.OpenHour / FreezeHour and the scheme cutover.
  const now = new Date(d.now); const lagosH = Number(now.toLocaleString('en-GB',{hour:'2-digit',hour12:false,timeZone:'Africa/Lagos'}));
  const steps=[['10:00','Open','orders accepted'],['12:00','Freeze','book closes'],['Uncross','Price discovered','one price, someone named it'],['Surveillance','Session reviewed','mark · wash · ramp'],['Buyback','Treasury release','pays the price it found'],['20:00','Cutover','business date rolls']];
  let cur = !d.is_trading ? -1 : published>0 ? (lagosH>=20?5:4) : accepting>0 ? 0 : lagosH<10 ? -1 : lagosH<12 ? 0 : sessTotal>0 ? 2 : 1;
  const timeline = `<div class="timeline"><div class="tl-track">${steps.map((s,i)=>`<div class="tl-step ${i<cur?'done':''} ${i===cur?'now':''}">${i===cur?'<div class="pin">now</div>':''}<div class="bar"></div><div class="t">${esc(s[0])}${/^\d/.test(s[0])?' · '+esc(s[1]):''}</div><div class="d">${esc(/^\d/.test(s[0])?s[2]:s[1]+' — '+s[2])}</div></div>`).join('')}</div>
    <div class="muted" style="margin-top:12px;font-size:12px">${d.is_trading?`Trading day · phase <b>${esc(title(d.phase))}</b> · ${esc(now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'}))} Lagos`:'Not a trading day. Nothing opens; the reference carries forward.'}${cur===-1&&d.is_trading?' · before the open':''}</div></div>`;

  el.innerHTML = `<div class="pad">
    <div class="tiles">${tiles}</div>
    <div class="sec-h"><h2>Session timeline</h2><span class="muted">${esc(d.business_date)}</span></div>${timeline}
    <div class="sec-h"><h2>Needs a decision</h2><span class="muted">${d.queue.length} item${d.queue.length===1?'':'s'}</span></div><div class="panel" id="ov-queue"></div>
    <div class="two" style="margin-top:26px">
      <div><div class="sec-h" style="margin-top:0"><h2>Participant net positions</h2><span class="muted">ledger, and the last computed batch</span><a href="#/settlement">Settlement</a></div><div class="panel" id="ov-pos"></div></div>
      <div><div class="sec-h" style="margin-top:0"><h2>Instruments today</h2><a href="#/instruments">All instruments</a></div><div class="panel" id="ov-inst"></div></div>
    </div></div>`;
  const qspec = {columns:[{k:'kind',l:'Kind',t:'chip',tone:v=>({alert:'red',halt:'red',disclosure:'orange',stale_reference:'yellow',incident:'yellow',mm_breach:'orange',application:'blue',break:'orange',gate:'green'}[v]||'gray')},{k:'symbol',l:'Symbol',t:'sym',h:symLink},{k:'title',l:'What',t:'text'},{k:'detail',l:'Detail',t:'text'},{k:'at',l:'Since',t:'time'},{k:'href',l:'',t:'link',text:'Open',nosort:true}], empty:'Nothing is waiting on a decision.'};
  renderTable(qspec, d.queue, {el:$('#ov-queue'), compact:true, onRow:r=>{ location.hash=r.href; }});
  const pspec = {columns:[{k:'code',l:'Participant',t:'sym'},{k:'roles',l:'Roles',t:'text',h:v=>(v||[]).map(x=>chip(x)).join(' ')},{k:'settlement_kobo',l:'Settlement',t:'kobo'},{k:'interchange_kobo',l:'Interchange',t:'kobo'},{k:'net_debit_cap_kobo',l:'Debit cap',t:'kobo'},{k:'last_net_kobo',l:'Last batch net',t:'kobo'},{k:'last_state',l:'Batch',t:'chip'}], empty:'No scheme participants yet.'};
  renderTable(pspec, d.positions, {el:$('#ov-pos'), compact:true, onRow:r=>openPeek({title:r.legal_name, sub:r.code, chips:[chip(r.status)].concat((r.roles||[]).map(x=>chip(x))), attrs: attrsFrom(pspec.columns, r)+attrRow('Collateral', naira(r.collateral_kobo),'money')+attrRow('Last batch', r.last_batch_date,'date')})});
  const ispec = {columns:[{k:'symbol',l:'Symbol',t:'sym',h:symLink},{k:'session_state',l:'Session',t:'chip'},{k:'reference_price_kobo',l:'Reference',t:'kobo'},{k:'halted',l:'Halted',t:'bool',yes:'halted',no:'trading',yesTone:'red',noTone:'green'}], empty:'No listed instruments.'};
  renderTable(ispec, d.instruments, {el:$('#ov-inst'), compact:true, onRow:r=>{ location.hash='#/instruments/'+r.symbol; }});
}

// ---------- halts & incidents ----------
function renderHalts(el){
  const d=state.data; const open=d.halts.extra?.open||[], hist=d.halts.rows||[], inc=d.incidents.rows||[];
  $('#toolbar').innerHTML=`<span class="muted" style="font-size:12px">${open.length} open halt${open.length===1?'':'s'} · ${inc.filter(x=>x.open).length} unresolved incident${inc.filter(x=>x.open).length===1?'':'s'}</span>`;
  el.innerHTML=`<div class="pad"><div class="sec-h" style="margin-top:0"><h2>Open halts</h2><span class="muted">the market saying it does not know the price</span></div><div class="panel" id="h-open"></div>
    <div class="sec-h"><h2>Data-quality incidents</h2><span class="muted">band breaches, stale references, liquidity reviews</span></div><div class="panel" id="h-inc"></div>
    <div class="sec-h"><h2>Halt history</h2></div><div class="panel" id="h-hist"></div></div>`;
  const hspec={columns:[symCol,{k:'reason',l:'Reason',t:'chip'},{k:'raised_by',l:'Raised by',t:'text'},{k:'halted_at',l:'Halted',t:'time'},{k:'released_by',l:'Released by',t:'text'},{k:'released_at',l:'Released',t:'time'}], empty:'No open halts.'};
  const hpeek=r=>({title:r.symbol+' · '+title(r.reason), sub:'Halt '+r.id, chips:[chip(r.reason), r.open?chip('open','red'):chip('released','gray')], attrs: attrsFrom(hspec.columns, r), sections:[{title:'Detail', html: jsonBlock(r.detail)}], actions: r.open?haltActions(r.symbol,true):[]});
  renderTable(hspec, open, {el:$('#h-open'), compact:true, onRow:r=>openPeek(hpeek(r))});
  renderTable(Object.assign({},hspec,{empty:'No halts have been released yet.'}), hist, {el:$('#h-hist'), compact:true, onRow:r=>openPeek(hpeek(r))});
  const ispec={columns:[{k:'id',l:'Incident',t:'num',r:false,h:v=>`<span class="num">#${v}</span>`},symCol,{k:'kind',l:'Kind',t:'chip'},{k:'open',l:'State',t:'bool',yes:'unresolved',no:'resolved',yesTone:'orange',noTone:'green'},{k:'raised_at',l:'Raised',t:'time'},{k:'resolved_at',l:'Resolved',t:'time'}], empty:'No incidents.'};
  renderTable(ispec, inc, {el:$('#h-inc'), compact:true, onRow:r=>openPeek({title:'#'+r.id+' '+title(r.kind), sub:(r.symbol||'')+' · '+fmtTime(r.raised_at), chips:[chip(r.kind), r.open?chip('unresolved','orange'):chip('resolved','green')], attrs: attrsFrom(ispec.columns, r), sections:[{title:'Detail', html: jsonBlock(r.detail)}]})});
}

// ---------- line chart (plain SVG) ----------
function lineChart(el, pts, opts={}){
  const W=Math.max(360, el.clientWidth||760), H=280, L=54, R=16, T=16, B=30; const marks = opts.marks||[];
  if(!pts.length){ el.innerHTML='<div class="empty" style="padding:60px 0;text-align:center">No observations yet.</div>'; return; }
  const ys=pts.map(p=>p.y); let lo=Math.min(...ys), hi=Math.max(...ys); if(lo===hi){ lo=lo*0.95||0; hi=hi*1.05||1; } const pad=(hi-lo)*0.08; lo-=pad; hi+=pad;
  const x=i=>L+(pts.length===1?(W-L-R)/2:(i/(pts.length-1))*(W-L-R)), y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const fmt=opts.fmt||(v=>v.toFixed(2)); const ticks=[0,.25,.5,.75,1].map(t=>lo+(hi-lo)*t);
  const grid=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--hair)" stroke-width="1"/><text x="${L-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="JetBrains Mono,monospace">${fmt(v)}</text>`).join('');
  const xl=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}" font-size="11" fill="var(--ink-3)" font-family="JetBrains Mono,monospace">${esc(pts[i].x)}</text>`).join('');
  const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.y).toFixed(1)).join(' ');
  const mk=marks.map(m=>{ const i=pts.findIndex(p=>p.x>=m.x); if(i<0) return ''; return `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${T}" y2="${H-B}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="2 3"/><text x="${(x(i)+4).toFixed(1)}" y="${T+10}" font-size="10" fill="var(--ink-3)">${esc(m.label)}</text>`; }).join('');
  const last=pts[pts.length-1];
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" id="ch">${grid}${xl}${mk}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(last.y).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/><circle id="ch-dot" r="3.5" fill="var(--panel)" stroke="var(--accent)" stroke-width="2" style="display:none"/><line id="ch-x" y1="${T}" y2="${H-B}" stroke="var(--hair-2)" style="display:none"/><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="ch-hit"/></svg><div class="tip" id="ch-tip" style="display:none"></div>`;
  const svg=$('#ch',el), hit=$('#ch-hit',el), tip=$('#ch-tip',el), dot=$('#ch-dot',el), vx=$('#ch-x',el);
  hit.onmousemove=e=>{ const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width*W; const i=Math.max(0,Math.min(pts.length-1,Math.round((px-L)/(W-L-R)*(pts.length-1)))); const p=pts[i];
    dot.setAttribute('cx',x(i)); dot.setAttribute('cy',y(p.y)); dot.style.display=''; vx.setAttribute('x1',x(i)); vx.setAttribute('x2',x(i)); vx.style.display='';
    tip.style.display=''; tip.style.left=(x(i)/W*r.width)+'px'; tip.style.top=(y(p.y)/H*r.height)+'px'; tip.innerHTML=`<b>${esc(p.x)}</b><br>${esc(p.label||fmt(p.y))}`; };
  hit.onmouseleave=()=>{ tip.style.display='none'; dot.style.display='none'; vx.style.display='none'; };
}

  state.tab = state.tab && tabs.some(t=>t[0]===state.tab) ? state.tab : 'sessions';
  $('#content').innerHTML=`<div class="record"><div class="rec-h"><div class="tile lg">${esc(sym.slice(0,2))}</div><div class="name"><h1>${esc(sym)}</h1><div class="sub">${esc(i.legal_name)}${i.trading_name?' · '+esc(i.trading_name):''}</div><div class="chips">${chip(i.status)}${chip(i.clob_review_state)}${i.halted?chip('halted · '+i.halt_reason,'red'):chip('trading','green')}${i.session_state?chip('session '+i.session_state):''}${liq.passes?chip('meets liquidity standard','green'):''}</div></div></div>
    <div class="rec" style="margin-top:14px;border-top:1px solid var(--hair)">${left}<div class="rec-main"><div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${state.tab===t[0]?'on':''}">${esc(t[1])}${t[2]!==''&&t[2]!=null?`<span class="cnt">${t[2]}</span>`:''}</button>`).join('')}</div><div class="tab-body" id="tab-body"></div></div></div></div>`;
  $$('.tabs button').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; $$('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); renderTab(); });
  renderTab();
}
function renderTab(){
  const d=state.data, i=d.instrument, el=$('#tab-body'); const liq=d.liquidity;
  switch(state.tab){
    case 'sessions': renderTable(Object.assign({},VIEWS.sessions,{columns:[{k:'session_date',l:'Session',t:'sym',h:v=>`<span class="num">${esc(v)}</span>`},...VIEWS.sessions.columns.slice(1)]}), d.sessions, {el, compact:true, onRow:r=>openPeek(VIEWS.sessions.peek(r))}); break;
    case 'price': { const exs=d.corporate_actions.filter(c=>c.state!=='cancelled').map(c=>({x:c.ex_date,label:'ex '+title(c.kind)}));
      el.innerHTML=`<div class="pad"><div class="chart" id="px"></div><div class="legend"><span><i></i>adjusted price, last ${d.prices.length} observations</span><span><i class="ex"></i>ex-date</span><span class="faint">endpoint ${d.prices.length?naira(d.prices[d.prices.length-1].adj_price_kobo)+' on '+d.prices[d.prices.length-1].obs_date:'—'}</span></div><div class="panel" style="margin-top:16px" id="px-tbl"></div></div>`;
      lineChart($('#px'), d.prices.map(p=>({x:p.obs_date, y:p.adj_price_kobo/100, label:naira(p.adj_price_kobo)+' · '+title(p.source)+' · '+sharesC(p.adj_volume_units)+' sh'})), {fmt:v=>'₦'+v.toFixed(2), marks:exs});
      renderTable({columns:[{k:'obs_date',l:'Date',t:'sym',h:v=>`<span class="num">${esc(v)}</span>`},{k:'source',l:'Source',t:'chip'},{k:'price_kobo',l:'Price',t:'kobo'},{k:'adj_price_kobo',l:'Adjusted',t:'kobo'},{k:'volume_units',l:'Volume',t:'units'},{k:'trade_count',l:'Trades',t:'num'}], empty:'No observations.'}, d.prices.slice().reverse(), {el:$('#px-tbl'), compact:true}); break; }
    case 'gate': el.innerHTML=`<div class="pad"><div class="sec-h" style="margin-top:0"><h2>${liq.passes?'Meets the standard':liq.failures.length+' of 9 criteria failing'}</h2><span class="muted">trailing ${liq.window} sessions as of ${esc(liq.as_of)} · ${i.clob_enabled?'trading continuously':'auction-only'}</span></div>
      <div class="check"><div class="hd-row"></div><div class="hd-row">Criterion</div><div class="hd-row" style="justify-content:flex-end">Measured</div><div class="hd-row" style="justify-content:flex-end">Required</div>${liq.criteria.map(c=>{ const f=v=>c.kind==='kobo'?naira(v):c.kind==='bps'?bps(v):c.kind==='count'?int(v):esc(String(v)); const op=c.op==='<='?'≤ ':c.op==='>='?'≥ ':''; return `<div class="${c.met?'ok':'no'}">${ic(c.met?'check':'x')}</div><div>${esc(c.criterion)}</div><div class="num" style="justify-content:flex-end">${f(c.measured)}</div><div class="num muted" style="justify-content:flex-end">${op}${f(c.required)}${c.unit?' <span class="faint" style="margin-left:5px;font-family:Inter,sans-serif">'+esc(c.unit)+'</span>':''}</div>`; }).join('')}</div>
      <p class="muted" style="margin-top:14px;font-size:12px">Every criterion is a count of distinct unrelated participants or a concentration limit, because those are the ones an issuer cannot satisfy by trading with itself. Graduation is reversible.</p></div>`; break;
    case 'mm': { const spec=VIEWS['market-makers']; if(!d.providers.length){ el.innerHTML='<div class="empty">No designated market maker on this symbol.</div>'; break; }
      el.innerHTML='<div class="pad">'+d.providers.map((p,k)=>`<div class="sec-h" style="margin-top:${k?22:0}px"><h2>${esc(p.member)}</h2><span class="muted">${esc(p.member_name)} · ${chip(p.state)} · uptime ${bps(p.uptime_bps)} over ${p.uptime_sessions} sessions · min ${naira(p.min_quote_kobo)} a side, spread ≤ ${bps(p.max_spread_bps)}</span></div><div class="panel" id="mm-${k}"></div>`).join('')+'</div>';
      d.providers.forEach((p,k)=>renderTable({columns:[{k:'session_date',l:'Session',t:'sym',h:v=>`<span class="num">${esc(v)}</span>`},{k:'met',l:'Obligation',t:'bool',yes:'met',no:'not met',yesTone:'green',noTone:'red'},{k:'shortfall',l:'Shortfall',t:'text'},{k:'bid_kobo',l:'Bid',t:'kobo'},{k:'ask_kobo',l:'Ask',t:'kobo'},{k:'spread_bps',l:'Spread',t:'bps'},{k:'size_kobo',l:'Size',t:'kobo'},{k:'two_sided',l:'Two-sided',t:'bool'}], empty:'Not yet measured in any session.'}, p.recent, {el:$('#mm-'+k), compact:true})); break; }
    case 'related': renderTable({columns:[{k:'group_key',l:'Group',t:'sym',h:v=>`<span class="mono">${esc(v)}</span>`},{k:'relation',l:'Relation',t:'chip',tone:'purple'},{k:'owner_name',l:'Owner',t:'text'},{k:'owner_type',l:'Owner type',t:'chip',tone:'gray'},{k:'account_kind',l:'Account',t:'text'},{k:'effective',l:'Effective',t:'mono',full:true},{k:'account_id',l:'Account id',t:'mono'}], empty:'No related parties recorded. The issuer, its treasury, directors, staff and the merchant should be here.'}, d.related_parties, {el, compact:true}); break;
    case 'corp': renderTable(VIEWS['corporate-actions'], d.corporate_actions, {el, compact:true, onRow:r=>openPeek(VIEWS['corporate-actions'].peek(r))}); break;
    case 'disc': renderTable(VIEWS.disclosures, d.disclosures, {el, compact:true, onRow:r=>openPeek(VIEWS.disclosures.peek(r))}); break;
    case 'holders': renderTable({columns:[{k:'cardholder_ref',l:'Holder',t:'sym',h:v=>`<span class="mono">${esc(v)}</span>`},{k:'display_name',l:'Name',t:'text'},{k:'related',l:'Related',t:'bool',yes:'related party',no:'unrelated',yesTone:'purple',noTone:'gray'},{k:'units',l:'Units',t:'units'},{k:'locked_units',l:'Locked',t:'units'},{k:'cost_kobo',l:'Cost',t:'kobo'},{k:'lots',l:'Lots',t:'num'},{k:'first_acquired',l:'First acquired',t:'date'}], empty:'No holders yet.'}, d.holders, {el, compact:true}); break;
    case 'halts': { el.innerHTML=`<div class="pad"><div class="sec-h" style="margin-top:0"><h2>Halts</h2></div><div class="panel" id="rh"></div><div class="sec-h"><h2>Alerts</h2><span class="muted">latest 20</span></div><div class="panel" id="ra"></div><div class="sec-h"><h2>Closed periods</h2></div><div class="panel" id="rcp"></div></div>`;
      const hspec={columns:[{k:'reason',l:'Reason',t:'sym',h:v=>chip(v)},{k:'open',l:'State',t:'bool',yes:'open',no:'released',yesTone:'red',noTone:'gray'},{k:'raised_by',l:'Raised by',t:'text'},{k:'halted_at',l:'Halted',t:'time'},{k:'released_by',l:'Released by',t:'text'},{k:'released_at',l:'Released',t:'time'}], empty:'Never halted.'};
      renderTable(hspec, d.halts, {el:$('#rh'), compact:true, onRow:r=>openPeek({title:title(r.reason), sub:'Halt '+r.id, chips:[r.open?chip('open','red'):chip('released','gray')], attrs: attrsFrom(hspec.columns, r), sections:[{title:'Detail', html:jsonBlock(r.detail)}], actions: r.open?haltActions(i.symbol,true):[]})});
      renderTable(Object.assign({},VIEWS.surveillance,{columns:VIEWS.surveillance.columns.filter(c=>c.k!=='symbol')}), d.alerts, {el:$('#ra'), compact:true, onRow:r=>openPeek(VIEWS.surveillance.peek(r))});
      renderTable({columns:[{k:'reason',l:'Reason',t:'sym',h:v=>chip(v)},{k:'period',l:'Period',t:'mono',full:true},{k:'declared_by',l:'Declared by',t:'text'},{k:'created_at',l:'Declared',t:'time'}], empty:'No closed periods.'}, d.closed_periods, {el:$('#rcp'), compact:true}); break; }
    case 'cap': renderTable({columns:[{k:'id',l:'Event',t:'num',r:false,h:v=>`<span class="num">#${v}</span>`},{k:'kind',l:'Kind',t:'chip',tone:'gray'},{k:'units_delta',l:'Units',t:'units',h:v=>`<span class="num">${v>0?'+':''}${shares(v)}</span>`},{k:'note',l:'Note',t:'text'},{k:'ledger_tx_id',l:'Ledger tx',t:'mono'},{k:'occurred_at',l:'At',t:'time'}], empty:'No cap table events.'}, d.cap_table_events, {el, compact:true}); break;
  }
}

// ---------- start ----------
if(SS.get()) boot(); else { $('#signin').hidden=false; $('#si-name').focus(); }
</script>
