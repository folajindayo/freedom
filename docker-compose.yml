services:
  db:
    image: postgres:15-alpine
    container_name: oja-db
    environment:
      POSTGRES_USER: oja
      POSTGRES_PASSWORD: oja
      POSTGRES_DB: oja
    ports: ["5433:5432"]
    volumes: ["oja-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oja"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  oja-pgdata:
